services:
  db:
    image: postgres:16
    container_name: nfc_museum_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: museum
      POSTGRES_USER: museum
      POSTGRES_PASSWORD: museum
    ports:
      - "5432:5432"
    volumes:
      - museum_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U museum -d museum"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: nfc_museum_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://museum:museum@db:5432/museum
      # APP_BASE_URL is optional. If it is not set, FastAPI stores image URLs
      # using the same host Android used to call the API.
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  museum_pg_data:
